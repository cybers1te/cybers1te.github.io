<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>message-me</title>
<meta name="description" content="message-me : messagerie en temps réel. Discussions à deux ou en groupe, synchronisées instantanément sur tous tes appareils.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <div class="splash" role="status">
    <span class="splash-mark" aria-hidden="true"></span>
    <p>Chargement de message-me…</p>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript>
  <div class="center"><div class="card">
    <h1>JavaScript est nécessaire</h1>
    <p>message-me fonctionne entièrement dans le navigateur et se connecte à
      Firebase en JavaScript. Active-le pour discuter.</p>
  </div></div>
</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
