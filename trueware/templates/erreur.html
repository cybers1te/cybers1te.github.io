{% extends "base.html" %}
{% block title %}{{ titre }}{% endblock %}

{% block body %}
<section class="wrap narrow">
  <div class="empty big">
    <p class="kick">Erreur {{ code }}</p>
    <h1>{{ titre }}</h1>
    {% if detail %}<p class="lead">{{ detail }}</p>{% endif %}
    <div class="done-cta">
      <a class="btn btn-outline" href="{{ url_for('catalogue') }}">Catalogue</a>
      <a class="btn btn-primary" href="{{ url_for('home') }}">Retour à l'accueil</a>
    </div>
  </div>
</section>
{% endblock %}
