name: message-me — application Android

# Construit l'APK (Trusted Web Activity) avec les outils Android de GitHub,
# l'essaie sur un émulateur, puis dépose l'APK non signé et les captures
# dans android/dist/ de la branche. La signature se fait hors de GitHub,
# avec une clé qui n'est jamais publiée.
on:
  push:
    branches: ['claude/**']
    paths: ['android/**', '!android/dist/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try on an emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash android/ci-smoke.sh

      - name: Commit the unsigned APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/dist/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android/dist
          git commit -m "ci(android): APK non signé et captures de l'émulateur"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
